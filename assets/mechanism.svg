<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="440"><stop stop-color="#07070b"/><stop offset="1" stop-color="#0a0a12"/></linearGradient>
    <style>
      .h  { fill:#fafafa; font-size:21px; font-weight:700; letter-spacing:-0.4px; }
      .p  { fill:#a1a1aa; font-size:13.5px; }
      .n  { font-family:ui-monospace,monospace; font-size:13px; }
      .eb { font-size:11px; font-weight:600; letter-spacing:0.2em; }
    </style>
  </defs>
  <rect width="1200" height="440" fill="url(#mbg)"/>
  <text x="60" y="60" fill="#fafafa" font-size="26" font-weight="700" letter-spacing="-0.6">Three rails. One market.</text>
  <text x="60" y="88" class="p" font-size="14">Each solves a problem the other two can't.</text>

  <!-- Rail 1: AMM -->
  <g transform="translate(60 130)">
    <rect width="350" height="250" rx="16" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.28"/>
    <text x="28" y="44" class="n" fill="#3b82f6">01</text>
    <text x="28" y="70" class="eb" fill="#60a5fa">THE AMM</text>
    <text x="28" y="108" class="h">Every share has a</text>
    <text x="28" y="134" class="h">price, every second.</text>
    <text x="28" y="170" class="p">A constant-product pool (x·y=k) quotes</text>
    <text x="28" y="190" class="p">fractions continuously — no order books,</text>
    <text x="28" y="210" class="p">no makers, no waiting. A 2% swap fee</text>
    <text x="28" y="230" class="p">stays in the pool, deepening it and</text>
    <text x="28" y="250" class="p">taxing arbitrage bots.</text>
  </g>

  <!-- Rail 2: Appraiser -->
  <g transform="translate(425 130)">
    <rect width="350" height="250" rx="16" fill="#22c55e" fill-opacity="0.05" stroke="#22c55e" stroke-opacity="0.28"/>
    <text x="28" y="44" class="n" fill="#22c55e">02</text>
    <text x="28" y="70" class="eb" fill="#34d399">THE APPRAISER</text>
    <text x="28" y="108" class="h">Every listing speaks</text>
    <text x="28" y="134" class="h">the same language.</text>
    <text x="28" y="170" class="p">A multimodal LLM (Gemini) reads the</text>
    <text x="28" y="190" class="p">seller's photos + notes and writes a</text>
    <text x="28" y="210" class="p">Christie's-grade prospectus. Buyers get</text>
    <text x="28" y="230" class="p">an apples-to-apples briefing. Sellers</text>
    <text x="28" y="250" class="p">stop writing copy.</text>
  </g>

  <!-- Rail 3: Oracle -->
  <g transform="translate(790 130)">
    <rect width="350" height="250" rx="16" fill="#a78bfa" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.28"/>
    <text x="28" y="44" class="n" fill="#a78bfa">03</text>
    <text x="28" y="70" class="eb" fill="#c4b5fd">THE ORACLE</text>
    <text x="28" y="108" class="h">Every price is</text>
    <text x="28" y="134" class="h">anchored to reality.</text>
    <text x="28" y="170" class="p">A Python service scrapes live retail</text>
    <text x="28" y="190" class="p">comps, then routes them through an</text>
    <text x="28" y="210" class="p">Isolation Forest that drops counterfeits</text>
    <text x="28" y="230" class="p">+ outliers. The median of the surviving</text>
    <text x="28" y="250" class="p">cluster is the fair-value floor.</text>
  </g>
</svg>
